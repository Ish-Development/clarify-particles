<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clarify: tune a section</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@500&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; background: #060709; min-height: 100vh; }
      #toast {
        position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 100;
        padding: 10px 14px; border-radius: 8px; background: #1c2329; color: #f4f7fa;
        font: 13px/1.3 system-ui; opacity: 0; transition: opacity 0.2s; pointer-events: none;
      }
      #toast.show { opacity: 1; }
    </style>
  </head>
  <body>
    <!-- Dev-only: one section at its real size (no scaling, so fine
         patterns render 1:1) with a DialKit panel for its grid settings.
         /tune.html?preset=cta-grid -->
    <main id="section"></main>
    <div id="toast"></div>
    <script type="module" src="/src/playground/tune.ts"></script>
  </body>
</html>
