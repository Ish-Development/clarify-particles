<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Clarify particles: section reference</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
html, body { margin: 0; background: #060709; }
/* Design tokens from the Figma file "Clarify — Website Design Foundation"
   (variables, as named there). The Webflow site should define the same
   variables; section markup here only references these. */
:root {
  /* color */
  --background-bg-primary: #060709;
  --background-bg-secondary: #080a0c;
  --border-border-primary: #2f323680;
  --text-text-primary: #f8fbfd;
  --text-text-secondary: #dee2e8;
  --neutrals-bone-100: #f4f7fa;
  --mist-500: #5f8db4;
  --mist-600: #a4c9e9;
  --button-primary-bg: #dee2e8;
  --button-primary-text: #030304;

  /* type */
  --family-heading-primary: "Geist", system-ui, sans-serif;
  --family-text-primary: "Geist", system-ui, sans-serif;
  --family-text-secondary: "Geist Mono", ui-monospace, monospace;
  --headings-size-h2: 44px;
  --body-size-text-medium: 18px;
  --eyebrow-size-eyebrow-large: 14px;
  --buttons-size-button-large: 16px;

  /* space & layout */
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-8: 64px;
  --section-space-m: 80px;
  --section-space-xxl: 240px;
  --grid-margin: 80px;
  --grid-gutter: 24px;

  /* radius */
  --radius-small: 8px;
  --radius-x-large: 24px;
}



/* Section markup mirroring the Figma frames — the playground's tuning
   backdrop, and a reference for the Webflow build. */

.section-frame { width: 1512px; font-family: var(--family-text-primary); -webkit-font-smoothing: antialiased; }
.section-frame * { box-sizing: border-box; }

/* --- shared components --- */

.eyebrow { display: flex; align-items: center; gap: var(--space-2); }
.eyebrow__grid { display: grid; grid-template-columns: repeat(4, 2px); gap: 1px; }
.eyebrow__grid i { width: 2px; height: 2px; background: var(--mist-500); }
.eyebrow__grid i.on { background: var(--mist-600); }
.eyebrow__label {
  font: 500 var(--eyebrow-size-eyebrow-large) / 1 var(--family-text-secondary);
  color: var(--text-text-secondary);
  text-transform: uppercase;
  white-space: nowrap;
}

.btn {
  display: inline-flex; align-items: center; gap: var(--space-2);
  padding: var(--space-4) var(--space-5);
  border-radius: var(--radius-small);
  font: 500 var(--buttons-size-button-large) / 1 var(--family-text-primary);
  text-decoration: none; white-space: nowrap;
}
.btn--primary { background: var(--button-primary-bg); color: var(--button-primary-text); border: 1px solid rgba(255, 255, 255, 0.12); }

/* --- CTA (Figma 13311:5898) --- */

.cta { background: var(--background-bg-primary); padding: var(--section-space-m) var(--grid-margin); }
.cta__card {
  position: relative;
  overflow: clip;
  background: var(--background-bg-secondary);
  border: 1px solid var(--border-border-primary);
  border-radius: var(--radius-x-large);
  padding: var(--section-space-xxl) var(--space-8);
}
/* the effect's area: the div the script creates, over the right 55% of the
   card (Webflow styles .u-particles-threejs the same way) */
.cta__card .u-particles-threejs { position: absolute; top: 0; right: 0; bottom: 0; left: 45%; }
.cta__content { display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-6); }
.cta__text { display: flex; flex-direction: column; gap: var(--space-4); width: 488px; }
.cta__title {
  margin: 0; width: 311px;
  font: 500 var(--headings-size-h2) / 1.1 var(--family-heading-primary);
  letter-spacing: -1px;
  color: var(--text-text-primary);
}
.cta__body {
  margin: 0; width: 456px;
  font: 400 var(--body-size-text-medium) / 1.35 var(--family-text-primary);
  color: var(--text-text-secondary);
}

</style>
</head>
<body>
<!-- Reference build of the Figma sections with the production script.
     In Webflow, only the data-* attributes and the script tag matter. -->
<section class="cta">
  <!-- the card is the particles component (scope + preset) and its wrap:
       the script creates div.u-particles-threejs inside it, which the CSS
       places over the right of the card (Webflow styles that class) -->
  <div class="cta__card" data-particles-component data-particles-wrap data-preset="cta">
    <div class="cta__content">
      <div class="eyebrow">
        <span class="eyebrow__grid" aria-hidden="true"
          ><i class="on"></i><i></i><i></i><i></i
          ><i></i><i class="on"></i><i class="on"></i><i></i
          ><i></i><i class="on"></i><i class="on"></i><i></i
          ><i></i><i></i><i></i><i class="on"></i
        ></span>
        <span class="eyebrow__label">Start today</span>
      </div>
      <div class="cta__text">
        <h2 class="cta__title">See how Clarify solves yours</h2>
        <p class="cta__body">Bring one site and one problem. We connect the data behind it and show you the fix in action</p>
      </div>
      <!-- data-particles-excite: hovering/focusing this energizes the effect -->
      <a class="btn btn--primary" href="#" data-particles-excite>Get started</a>
    </div>
  </div>
</section>

<script type="module" src="./particles.js"></script>
</body>
</html>
