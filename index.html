<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Particle System Tool</title>
    <style>
      html, body { margin: 0; padding: 0; background: #0a0a0a; overflow: hidden; height: 100%; }
      canvas { display: block; }
      #version-switch {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 10;
        display: flex;
        gap: 6px;
        font-family: sans-serif;
      }
      .version-btn {
        padding: 6px 14px;
        background: rgba(255, 255, 255, 0.08);
        color: #ccc;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 4px;
        cursor: pointer;
        font-size: 13px;
      }
      .version-btn:hover { border-color: rgba(255, 255, 255, 0.5); }
      .version-btn.active { background: #fff; color: #000; border-color: #fff; }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="version-switch">
      <button id="v1-btn" class="version-btn active">V1</button>
      <button id="v2-btn" class="version-btn">V2</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
