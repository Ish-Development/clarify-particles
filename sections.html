<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clarify sections preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@500&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; background: #060709; }
    </style>
  </head>
  <body>
    <!-- The site sections as they'll look in Webflow, running the production
         runtime (loader + engine) exactly as the Webflow script tag will. -->
    <main id="sections"></main>
    <script type="module">
      import "/src/sections/sections.css";
      import cta from "/src/sections/cta.html?raw";

      // templates carry the Webflow component markup; ?cta=<preset>
      // previews a variant (e.g. ?cta=cta-morph)
      const params = new URLSearchParams(location.search);
      function addSection(html, presetParam) {
        const tpl = document.createElement("template");
        tpl.innerHTML = html;
        const component = tpl.content.querySelector("[data-particles-component]");
        if (presetParam && params.get(presetParam)) component.setAttribute("data-preset", params.get(presetParam));
        document.getElementById("sections").append(tpl.content);
      }

      addSection(cta, "cta");
      await import("/src/runtime/index.ts");

      // ?debug: live engine state in the corner, also posted to the dev
      // server (.particles-debug.log) every second and on every lifecycle
      // event — so a stalled or missing effect can be diagnosed from the log
      if (new URLSearchParams(location.search).has("debug")) {
        const box = document.createElement("pre");
        box.style.cssText =
          "position:fixed;left:12px;bottom:12px;z-index:99;margin:0;padding:10px 12px;max-width:420px;" +
          "background:rgba(0,0,0,.85);color:#9fe29f;font:11px/1.4 ui-monospace,monospace;border-radius:8px;pointer-events:none;white-space:pre-wrap";
        document.body.append(box);
        const snapshot = (reason) => ({
          t: Math.round(performance.now()),
          reason,
          ua: navigator.userAgent.match(/(Arc|Chrome|Safari|Firefox)\/[\d.]+/g)?.join(" "),
          vis: document.visibilityState,
          focus: document.hasFocus(),
          state: window.ClarifyParticles.debug(),
        });
        const ship = (reason) =>
          fetch("/__log", { method: "POST", body: JSON.stringify(snapshot(reason)), keepalive: true }).catch(() => {});
        setInterval(() => (box.textContent = JSON.stringify(snapshot("tick"), null, 1)), 250);
        setInterval(() => ship("tick"), 1000);
        for (const ev of ["visibilitychange", "freeze", "resume"]) document.addEventListener(ev, () => ship(ev));
        for (const ev of ["focus", "blur", "pageshow", "pagehide"]) window.addEventListener(ev, () => ship(ev));
        ship("start");
      }
    </script>
  </body>
</html>
