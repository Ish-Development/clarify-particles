<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Export lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./lab.css" />
    <style>
      html, body { height: 100%; overflow: hidden; }
      /* the rail keeps the left, the panel the right, the timeline dock the bottom */
      #stage { position: absolute; inset: 0 var(--panel) 132px var(--rail); overflow: hidden; }
      #frame { position: absolute; left: 50%; top: 50%; overflow: hidden; outline: 1px dashed #ffffff33; cursor: grab; }
      #frame:active { cursor: grabbing; }
      #effect { position: absolute; }
      /* the loop's copy ahead, added over the model as it fades in */
      #effectB { position: absolute; pointer-events: none; mix-blend-mode: plus-lighter; }
      body.light #effectB { mix-blend-mode: multiply; }
      #hud { position: fixed; left: calc(var(--rail) + 24px); bottom: 148px; pointer-events: none; font: 12px var(--mono); color: var(--muted); }
      /* DialKit's panel as the right rail, its timeline dock along the bottom between the rails */
      .dialkit-panel[data-position="top-right"] { top: 0 !important; right: 0 !important; max-height: 100vh !important; }
      .dialkit-panel[data-position="top-right"] .dialkit-panel-inner[data-collapsed="false"] { width: var(--panel) !important; height: 100vh !important; max-height: 100vh !important; border-radius: 0 !important; border-width: 0 0 0 1px; padding: 16px 20px; }
      .dialkit-timeline { left: var(--rail) !important; right: var(--panel) !important; bottom: 0 !important; }
      .dialkit-timeline-dock { border-radius: 0 !important; border-width: 1px 0 0 !important; }
      /* the position pad in the frame's shape (layout() sets it), within reason */
      .dialkit-pad-surface { aspect-ratio: var(--frame-aspect, 1) !important; }
      /* light mode: the page behind the frame goes light too */
      body.light #stage { background: #e3e7ec; }
      body.light #frame { outline-color: #00000033; }
      body.light #hud { color: #575b5f; }
    </style>
  </head>
  <body>
    <nav id="rail">
      <div class="brand"><img src="./clarify-logo.svg" alt="Clarify" /><span class="eyebrow">Export lab</span></div>
      <div class="nav"><a class="btn" href="./models.html">← Models</a><a class="btn" href="./morph.html">Morph lab</a></div>
      <div class="list" id="list"></div>
      <div class="foot">
        <button class="btn primary" data-act="copy">Copy PNG</button>
        <button class="btn" data-act="copySvg">Copy SVG</button>
        <button class="btn" data-act="video">Export video</button>
      </div>
    </nav>
    <div id="stage">
      <div id="frame"><div id="effect"></div><div id="effectB"></div></div>
    </div>
    <div id="hud"></div>
    <script type="module" src="./export.ts"></script>
  </body>
</html>
